<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave a Review | GameDay Helpers</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Leave a quick review after your GameDay Helpers game.">
<link rel="canonical" href="https://gamedayhelpers.com/review.html">
<meta name="robots" content="noindex, nofollow"><meta property="og:type" content="website">
<meta property="og:site_name" content="GameDay Helpers">
<meta property="og:title" content="Leave a Review | GameDay Helpers">
<meta property="og:description" content="Leave a quick review after your GameDay Helpers game.">
<meta property="og:url" content="https://gamedayhelpers.com/review.html">
<meta property="og:image" content="https://gamedayhelpers.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Leave a Review | GameDay Helpers">
<meta name="twitter:description" content="Leave a quick review after your GameDay Helpers game.">
<meta name="twitter:image" content="https://gamedayhelpers.com/og.png">
<meta name="theme-color" content="#102A43">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="banner">You coach. We score.</div>

<header>
  <a href="index.html"><img class="logo-img" src="gdh-logo.png" alt="GameDay Helpers"></a>
</header>

<main id="main">
<section>
  <div class="wrap">
    <div class="form-card" id="reviewCard">
      <h1 class="text-center">Rate <span class="o" id="who">your helper</span></h1>
      <p class="lead text-center intro-copy">How did the game go? Choose a rating and add a comment if you like.</p>

      <div class="starpick" id="stars" role="group" aria-label="Choose a rating out of five">
        <button data-v="1" type="button" aria-label="1 out of 5: Poor">&#9733;</button>
        <button data-v="2" type="button" aria-label="2 out of 5: Fair">&#9733;</button>
        <button data-v="3" type="button" aria-label="3 out of 5: Good">&#9733;</button>
        <button data-v="4" type="button" aria-label="4 out of 5: Great">&#9733;</button>
        <button data-v="5" type="button" aria-label="5 out of 5: Excellent">&#9733;</button>
      </div>
      <div class="rlabel" id="rlabel" role="status" aria-live="polite" aria-atomic="true"></div>

      <div class="field">
        <label for="comment">Anything to add? <span class="hint hint-inline">(optional)</span></label>
        <textarea id="comment" placeholder="On time, knew the app, easy to work with..."></textarea>
      </div>

      <button class="submit" id="rsubmit" onclick="submitReview()">Submit review</button>
      <div class="err" id="rerr" role="alert" aria-live="assertive"></div>
    </div>

    <div class="success" id="reviewSuccess" role="status" aria-live="polite">
      <h2>Thank you.</h2>
      <p>Your review is in. It helps the whole GameDay Helpers community find reliable people.</p>
    </div>
  </div>
</section>

</main>

<footer>
  <img class="logo-img" src="gdh-logo.png" alt="GameDay Helpers">
  <div class="small">You coach. We score. &nbsp;&middot;&nbsp; &copy; 2026 GameDay Helpers</div>
</footer>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQnRjGHrkyzhreSnNxQy1ReXPac4VNLT-Wkz6qggE0OOsY-3v5zjdUclYkfkD6cncs/exec";

  const params = new URLSearchParams(location.search);
  const gameId = params.get('g') || '';
  const revieweeId = params.get('rev') || '';
  const revName = params.get('revname') || '';
  const revieweeRole = params.get('role') || 'helper';   // who is being reviewed
  const reviewerRole = params.get('by') || 'coach';      // who is writing it
  if (revName) document.getElementById('who').textContent = revName;

  let rating = 0;
  const labels = {1:"Poor",2:"Fair",3:"Good",4:"Great",5:"Excellent"};
  const starBtns = Array.from(document.querySelectorAll('#stars button'));
  starBtns.forEach(b=>{
    b.addEventListener('click', ()=>{
      rating = parseInt(b.dataset.v,10);
      starBtns.forEach(x=>x.classList.toggle('on', parseInt(x.dataset.v,10) <= rating));
      document.getElementById('rlabel').textContent = labels[rating] || '';
    });
  });

  function showErr(m){const e=document.getElementById('rerr');e.textContent=m;e.style.display='block';}

  async function submitReview(){
    document.getElementById('rerr').style.display='none';
    if(!rating){showErr('Tap a star to rate.');return;}
    if(!gameId){showErr('This review link is missing its game. Please use the link from your email.');return;}
    const btn=document.getElementById('rsubmit');btn.disabled=true;btn.textContent='Sending...';
    const payload={type:'REVIEW',gameId,revieweeId,revieweeRole,reviewerRole,stars:rating,comment:document.getElementById('comment').value.trim()};
    try{
      await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
      document.getElementById('reviewCard').style.display='none';
      document.getElementById('reviewSuccess').style.display='block';
      window.scrollTo({top:0,behavior:'smooth'});
    }catch(e){btn.disabled=false;btn.textContent='Submit review';showErr('Something went wrong. Please try again.');}
  }
</script>
</body>
</html>
