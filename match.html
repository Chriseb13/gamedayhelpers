<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | GameDay Helpers</title>
<meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#102A43">
<link rel="stylesheet" href="styles.css">
<style>
  .board { max-width: 1080px; margin: 0 auto; padding: 0 1.25rem; }
  .bar { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin: 1.5rem 0; }
  .bar input { flex: 1 1 220px; min-height: 48px; }
  .bar .btn { min-height: 48px; padding-inline: 1rem; }
  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: .75rem; margin-bottom: 1.5rem; }
  .kpi { padding: 1rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .kpi .num { font-family: var(--display); font-size: 2rem; color: var(--action); line-height: 1; }
  .kpi .lab { font-size: .875rem; color: var(--muted); margin-top: .25rem; }
  .game { border: 1px solid var(--border); border-radius: var(--radius-card); margin-bottom: 1.25rem; overflow: hidden; }
  .ghead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem 1rem; padding: 1rem 1.25rem; background: var(--dark); color: var(--white); }
  .ghead .when { font-family: var(--display); font-size: 1.5rem; line-height: 1.1; }
  .ghead .meta { font-size: .875rem; color: var(--inverse-muted); }
  .ghead .offer { font-family: var(--display); font-size: 1.5rem; color: var(--accent); }
  .gbody { padding: 1rem 1.25rem; }
  .gbody .needs { font-size: .9375rem; margin-bottom: .75rem; }
  .cand { display: grid; grid-template-columns: 1fr auto; gap: .5rem 1rem; align-items: center; padding: .75rem 0; border-top: 1px solid var(--border); }
  .cand .nm { font-weight: 700; color: var(--dark); }
  .cand .why { display: flex; flex-wrap: wrap; gap: .375rem; margin-top: .375rem; }
  .pill { font-size: .75rem; font-weight: 700; padding: .25rem .5rem; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--text); }
  .pill.good { background: #e8f3ea; border-color: #9fcaa8; color: var(--success); }
  .pill.bad { background: #fdecea; border-color: #f0b3ac; color: var(--error); }
  .pill.warn { background: #fff6dc; border-color: #ecd48a; color: #7a5200; }
  .cand .act { display: flex; gap: .5rem; }
  .cand .btn { min-height: 44px; padding-inline: .875rem; font-size: .9375rem; }
  .empty { padding: 1rem; color: var(--muted); font-size: .9375rem; }
  .status { margin-top: 1rem; padding: .75rem 1rem; border-radius: var(--radius); background: var(--surface); border-left: 4px solid var(--action); font-size: .9375rem; }
  .status.err { border-left-color: var(--error); color: var(--error); }
  details.helpers { margin-top: 2rem; }
  details.helpers summary { cursor: pointer; font-weight: 700; color: var(--dark); min-height: 44px; display: flex; align-items: center; }
  table { width: 100%; border-collapse: collapse; font-size: .875rem; margin-top: .75rem; }
  th, td { text-align: left; padding: .5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .muted { color: var(--muted); }
  .kpi { cursor: pointer; text-align: left; font: inherit; width: 100%; }
  .kpi:hover, .kpi[aria-pressed="true"] { border-color: var(--action); background: #eef3ff; }
  .kpi .sub { font-size: .75rem; color: var(--muted); margin-top: .25rem; }
  .wait { font-weight: 700; }
  .wait.hot { color: #ffd166; }
  .drill { margin: 0 0 1.5rem; padding: 1rem 1.25rem; border: 1px solid var(--action); border-radius: var(--radius-card); background: var(--white); }
  .drill h3 { display: flex; justify-content: space-between; align-items: center; gap: 1rem; font-size: 1.125rem; }
  .drill .close { min-height: 44px; padding-inline: .875rem; }
  .trends { display: grid; gap: 1rem; margin: 1.5rem 0; }
  .trend { padding: 1rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--white); }
  .trend .t { font-weight: 700; color: var(--dark); font-size: .9375rem; }
  .trend .s { font-size: .8125rem; color: var(--muted); margin-bottom: .5rem; }
  .trend svg { width: 100%; height: 96px; display: block; }
  .trend rect { fill: var(--action); }
  .trend rect:hover { fill: var(--action-hover); }
  .trend text { font-size: 11px; fill: var(--muted); }
  .trend text.v { fill: var(--text); font-weight: 600; }
  .sec { margin-top: 2rem; }
  @media (min-width: 640px) { .kpis { grid-template-columns: repeat(4, minmax(0,1fr)); } .trends { grid-template-columns: repeat(3, minmax(0,1fr)); } }
</style>
</head>
<body>
<div class="banner">Dashboard &middot; private</div>
<header>
  <a href="index.html" aria-label="GameDay Helpers home"><img class="logo-img" src="gdh-logo.png" alt="GameDay Helpers"></a>
</header>

<main id="main">
<section>
  <div class="board">
    <div class="eyebrow">Operator</div>
    <h1>Dash<span class="o">board.</span></h1>

    <div class="bar">
      <label for="key" class="sr-only">Admin key</label>
      <input type="password" id="key" placeholder="Admin key" autocomplete="current-password">
      <button class="btn btn-orange" id="load" type="button"><span>Load board</span></button>
      <button class="btn btn-dark" id="refresh" type="button" style="display:none"><span>Refresh</span></button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">Enter the admin key to load the board.</div>

    <div id="app" style="display:none">
      <h2 class="mb-4">Open <span class="o">requests.</span></h2>
      <div id="games"></div>

      <div class="sec">
        <div class="eyebrow">Numbers</div>
        <h2 class="mb-4">Where <span class="o">we stand.</span></h2>
        <p class="hint mb-4">Tap a tile to see the rows behind it.</p>
        <div class="kpis" id="kpis"></div>
        <div id="drill"></div>
      </div>

      <div class="sec">
        <div class="eyebrow">Trends</div>
        <h2 class="mb-4">Last <span class="o">8 weeks.</span></h2>
        <div class="trends" id="trends"></div>
      </div>

      <details class="helpers">
        <summary>All helpers</summary>
        <div id="helperTable"></div>
      </details>
    </div>
  </div>
</section>
</main>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQnRjGHrkyzhreSnNxQy1ReXPac4VNLT-Wkz6qggE0OOsY-3v5zjdUclYkfkD6cncs/exec";
  const $ = id => document.getElementById(id);
  let DATA = null;
  const keyBox = $('key');
  try { keyBox.value = localStorage.getItem('gdh_key') || ''; } catch (e) {}

  function setStatus(msg, err){ const s = $('status'); s.textContent = msg; s.classList.toggle('err', !!err); }
  function esc(s){ return String(s == null ? '' : s); }
  function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function pill(text, kind){ return el('span', 'pill' + (kind ? ' ' + kind : ''), text); }
  function csv(s){ return String(s || '').split(',').map(x => x.trim().toLowerCase()).filter(Boolean); }

  async function load(){
    const key = keyBox.value.trim();
    if (!key) { setStatus('Enter the admin key.', true); return; }
    setStatus('Loading...');
    try {
      const res = await fetch(SCRIPT_URL + '?op=board&key=' + encodeURIComponent(key), { redirect: 'follow' });
      const d = await res.json();
      if (d.result !== 'success') { setStatus(d.message || 'Could not load.', true); return; }
      DATA = d; try { localStorage.setItem('gdh_key', key); } catch (e) {}
      render(); $('app').style.display = ''; $('refresh').style.display = '';
      setStatus('Loaded ' + new Date(d.generated).toLocaleTimeString() + '. ' + d.games.length + ' games, ' + d.helpers.length + ' helpers.');
    } catch (e) { setStatus('Could not reach the backend. Is ADMIN_KEY set and the deployment on a new version?', true); }
  }

  async function post(payload){
    payload.key = keyBox.value.trim();
    const res = await fetch(SCRIPT_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    return res.json();
  }

  function dayBucket(iso){
    const d = new Date(iso); if (isNaN(d)) return null;
    const dow = d.getDay(); if (dow === 6) return 'saturdays'; if (dow === 0) return 'sundays'; return 'weekday evenings';
  }

  function eligible(h){
    if (h.minor && h.consent !== 'APPROVED') return { ok: false, why: 'Minor, no parent consent yet' };
    if (!h.approved) return { ok: false, why: 'Not reviewed yet' };
    return { ok: true };
  }

  function rank(game){
    const gl = String(game.league || '').toLowerCase();
    const needs = csv(game.needs);
    const bucket = dayBucket(game.when);
    return DATA.helpers.map(h => {
      const e = eligible(h);
      const leagues = csv(h.leagues), roles = csv(h.roles), avail = csv(h.avail);
      const leagueOk = gl ? leagues.some(l => gl.includes(l) || l.includes(gl)) : null;
      const roleHits = needs.filter(n => roles.includes(n));
      const roleOk = needs.length ? roleHits.length === needs.length : null;
      const availOk = bucket ? (avail.length ? avail.includes(bucket) : null) : null;
      let score = 0;
      if (e.ok) score += 1000;
      if (leagueOk) score += 300; else if (leagueOk === false) score -= 300;
      if (roleOk) score += 200; else if (roleOk === false) score += roleHits.length * 40 - 100;
      if (availOk) score += 100; else if (availOk === false) score -= 50;
      score += (h.avg || 0) * 20 + Math.min(h.gdh, 10) * 5 + Math.min(h.prior, 50) * 0.5;
      return { h, e, leagueOk, roleOk, roleHits, availOk, score };
    }).sort((a, b) => b.score - a.score);
  }

  function render(){
    const open = DATA.games.filter(g => g.status === 'OPEN').sort((a, b) => new Date(a.when) - new Date(b.when));
    const matched = DATA.games.filter(g => g.status === 'MATCHED').length;
    const ready = DATA.helpers.filter(h => eligible(h).ok).length;
    renderKpis(open, matched, ready);
    renderTrends();

    // Open requests first, longest waiting at the top
    open.sort((a, b) => new Date(a.requested || 0) - new Date(b.requested || 0));
    const box = $('games'); box.textContent = '';
    if (!open.length) box.appendChild(el('div', 'empty', 'No open requests. When a coach requests a game, it shows up here.'));
    open.forEach(g => {
      const card = el('div', 'game');
      const head = el('div', 'ghead');
      const left = el('div');
      left.appendChild(el('div', 'when', g.whenText));
      left.appendChild(el('div', 'meta', [g.league || 'League unknown', g.team, g.field || 'No field given'].filter(Boolean).join(' · ')));
      left.appendChild(el('div', 'meta', 'Coach ' + (g.coach || 'not registered') + ' · ' + g.coachEmail + (g.coachPhone ? ' · ' + g.coachPhone : '')));
      head.appendChild(left);
      const right = el('div'); right.appendChild(el('div', 'offer', '$' + g.offer)); right.appendChild(el('div', 'meta', g.length + ' hr · ' + g.id));
      const w = waiting(g.requested); const wl = el('div', 'meta wait' + (w.hours >= 24 ? ' hot' : ''), 'Waiting ' + w.text + (hoursUntil(g.when) < 48 ? ' · game in ' + fmtHours(hoursUntil(g.when)) : ''));
      right.appendChild(wl); head.appendChild(right);
      card.appendChild(head);
      const body = el('div', 'gbody');
      body.appendChild(el('div', 'needs', 'Needs: ' + (g.needs || 'not specified')));
      const ranked = rank(g).slice(0, 8);
      if (!ranked.length) body.appendChild(el('div', 'empty', 'No helpers yet.'));
      ranked.forEach(r => {
        const row = el('div', 'cand');
        const info = el('div');
        info.appendChild(el('div', 'nm', r.h.name + (r.h.founder ? ' · Founding #' + r.h.founder : '')));
        const why = el('div', 'why');
        why.appendChild(pill(r.e.ok ? 'Ready' : r.e.why, r.e.ok ? 'good' : 'bad'));
        if (r.leagueOk === true) why.appendChild(pill('Serves ' + g.league, 'good')); else if (r.leagueOk === false) why.appendChild(pill('Not in ' + g.league, 'bad'));
        if (r.roleOk === true) why.appendChild(pill('Does all ' + csv(g.needs).length + ' tasks', 'good')); else if (r.roleOk === false) why.appendChild(pill(r.roleHits.length + '/' + csv(g.needs).length + ' tasks', 'warn'));
        if (r.availOk === true) why.appendChild(pill('Free ' + dayBucket(g.when), 'good')); else if (r.availOk === false) why.appendChild(pill('Usually not free ' + dayBucket(g.when), 'warn'));
        why.appendChild(pill(r.h.skill || 'Skill not set'));
        why.appendChild(pill(r.h.avg ? '★ ' + r.h.avg + ' (' + r.h.count + ')' : 'No ratings'));
        why.appendChild(pill(r.h.gdh + ' GDH games · ' + r.h.prior + ' before'));
        info.appendChild(why);
        row.appendChild(info);
        const act = el('div', 'act');
        if (r.e.ok) {
          const b = el('button', 'btn btn-orange', 'Send match'); b.type = 'button';
          b.onclick = () => doMatch(g, r.h, b);
          act.appendChild(b);
        } else if (!r.h.approved && !(r.h.minor && r.h.consent !== 'APPROVED')) {
          const b = el('button', 'btn btn-dark', 'Approve'); b.type = 'button';
          b.onclick = () => doApprove(r.h, b);
          act.appendChild(b);
        }
        row.appendChild(act);
        body.appendChild(row);
      });
      const un = el('button', 'btn btn-dark mt-4', 'No helper available, notify coach'); un.type = 'button'; un.style.minHeight = '44px';
      un.onclick = () => doUnfill(g, un);
      body.appendChild(un);
      card.appendChild(body);
      box.appendChild(card);
    });

    const t = $('helperTable'); t.textContent = '';
    const table = el('table');
    const thead = el('thead'); const tr = el('tr');
    ['Name', 'Status', 'Leagues', 'Does', 'Free', 'Skill', 'Rating', 'Games', ''].forEach(h => tr.appendChild(el('th', null, h)));
    thead.appendChild(tr); table.appendChild(thead);
    const tb = el('tbody');
    DATA.helpers.forEach(h => {
      const e = eligible(h); const r = el('tr');
      r.appendChild(el('td', null, h.name + (h.founder ? ' #' + h.founder : '')));
      const st = el('td'); st.appendChild(pill(e.ok ? 'Ready' : e.why, e.ok ? 'good' : 'bad')); r.appendChild(st);
      r.appendChild(el('td', null, h.leagues)); r.appendChild(el('td', null, h.roles)); r.appendChild(el('td', null, h.avail || 'not set'));
      r.appendChild(el('td', null, h.skill)); r.appendChild(el('td', null, h.avg ? h.avg + ' (' + h.count + ')' : 'none'));
      r.appendChild(el('td', null, h.gdh + ' / ' + h.prior));
      const a = el('td');
      const b = el('button', 'btn btn-dark', h.approved ? 'Unapprove' : 'Approve'); b.type = 'button'; b.style.minHeight = '44px';
      b.onclick = () => doApprove(h, b, h.approved);
      a.appendChild(b); r.appendChild(a);
      tb.appendChild(r);
    });
    table.appendChild(tb); t.appendChild(table);
  }

  /* ---------- time helpers ---------- */
  function hoursSince(iso){ const d = new Date(iso); return isNaN(d) ? null : (Date.now() - d.getTime()) / 36e5; }
  function hoursUntil(iso){ const d = new Date(iso); return isNaN(d) ? Infinity : (d.getTime() - Date.now()) / 36e5; }
  function fmtHours(h){ if (h == null || !isFinite(h)) return 'unknown'; if (h < 1) return Math.max(1, Math.round(h * 60)) + ' min'; if (h < 48) return Math.round(h) + ' hr'; return Math.round(h / 24) + ' days'; }
  function waiting(iso){ const h = hoursSince(iso); return { hours: h == null ? 0 : h, text: h == null ? 'unknown' : fmtHours(h) }; }
  function weekKey(iso){ const d = new Date(iso); if (isNaN(d)) return null; const m = new Date(d); m.setHours(0,0,0,0); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; }

  /* ---------- KPIs with drill-down ---------- */
  function money(n){ return '$' + (Math.round(n * 100) / 100).toFixed(2); }
  function stats(){
    const g = DATA.games, done = g.filter(x => x.status === 'DONE' || x.status === 'MATCHED');
    const priced = g.filter(x => Number(x.offer) > 0 && Number(x.length) > 0);
    const avgOffer = priced.length ? priced.reduce((a, x) => a + Number(x.offer), 0) / priced.length : null;
    const avgHourly = priced.length ? priced.reduce((a, x) => a + Number(x.offer) / Number(x.length), 0) / priced.length : null;
    const open = g.filter(x => x.status === 'OPEN');
    const waitHrs = open.map(x => hoursSince(x.requested)).filter(x => x != null);
    const avgWait = waitHrs.length ? waitHrs.reduce((a, b) => a + b, 0) / waitHrs.length : null;
    const fillTimes = g.filter(x => x.matchSent && x.requested).map(x => (new Date(x.matchSent) - new Date(x.requested)) / 36e5);
    const avgFill = fillTimes.length ? fillTimes.reduce((a, b) => a + b, 0) / fillTimes.length : null;
    const hr = DATA.reviews.filter(r => r.revieweeRole === 'helper'), cr = DATA.reviews.filter(r => r.revieweeRole === 'coach');
    const avg = arr => arr.length ? (arr.reduce((a, r) => a + r.stars, 0) / arr.length).toFixed(1) : null;
    return { open, done, priced, avgOffer, avgHourly, avgWait, avgFill, hr, cr, avgH: avg(hr), avgC: avg(cr) };
  }
  let DRILL = null;
  function renderKpis(open, matched, ready){
    const st = stats();
    const tiles = [
      { k: 'open', num: open.length, lab: 'open requests', sub: st.avgWait != null ? 'avg waiting ' + fmtHours(st.avgWait) : 'nothing waiting', rows: () => gameRows(open) },
      { k: 'helpers', num: DATA.helpers.length, lab: 'helpers', sub: ready + ' ready, ' + (DATA.helpers.length - ready) + ' pending', rows: () => helperRows(DATA.helpers) },
      { k: 'coaches', num: DATA.coaches.length, lab: 'coaches', sub: DATA.coaches.filter(c => c.founder).length + ' founding', rows: () => coachRows(DATA.coaches) },
      { k: 'requests', num: DATA.games.length, lab: 'game requests, all time', sub: matched + ' matched, ' + DATA.games.filter(x => x.status === 'DONE').length + ' done, ' + DATA.games.filter(x => x.status === 'UNFILLED').length + ' unfilled', rows: () => gameRows(DATA.games) },
      { k: 'offer', num: st.avgOffer != null ? money(st.avgOffer) : '\u2014', lab: 'avg offer per game', sub: st.priced.length + ' priced requests', rows: () => gameRows(st.priced) },
      { k: 'hourly', num: st.avgHourly != null ? money(st.avgHourly) : '\u2014', lab: 'avg hourly pay', sub: 'offer divided by expected length', rows: () => gameRows(st.priced) },
      { k: 'fill', num: st.avgFill != null ? fmtHours(st.avgFill) : '\u2014', lab: 'avg time to match', sub: 'request to match email', rows: () => gameRows(DATA.games.filter(x => x.matchSent)) },
      { k: 'stars', num: st.avgH != null ? '\u2605 ' + st.avgH : '\u2014', lab: 'helper rating', sub: st.hr.length + ' helper reviews, ' + st.cr.length + ' coach reviews' + (st.avgC ? ', coaches \u2605 ' + st.avgC : ''), rows: () => reviewRows(DATA.reviews) },
      { k: 'leagues', num: DATA.leagues.length, lab: 'league inquiries', sub: DATA.leagues.filter(l => l.contacted === 'YES').length + ' contacted', rows: () => leagueRows(DATA.leagues) },
      { k: 'minors', num: DATA.helpers.filter(h => h.minor).length, lab: 'helpers under 18', sub: DATA.helpers.filter(h => h.minor && h.consent !== 'APPROVED').length + ' waiting on a parent', rows: () => helperRows(DATA.helpers.filter(h => h.minor)) },
    ];
    const box = $('kpis'); box.textContent = '';
    tiles.forEach(t => {
      const b = el('button', 'kpi'); b.type = 'button'; b.setAttribute('aria-pressed', DRILL === t.k ? 'true' : 'false');
      b.appendChild(el('div', 'num', String(t.num))); b.appendChild(el('div', 'lab', t.lab)); b.appendChild(el('div', 'sub', t.sub));
      b.onclick = () => { DRILL = DRILL === t.k ? null : t.k; renderKpis(open, matched, ready); showDrill(DRILL ? t : null); };
      box.appendChild(b);
    });
    if (DRILL) { const t = tiles.find(x => x.k === DRILL); if (t) showDrill(t); }
  }
  function showDrill(t){
    const d = $('drill'); d.textContent = ''; if (!t) return;
    const wrap = el('div', 'drill');
    const h = el('h3', null, t.lab + ' (' + t.num + ')');
    const c = el('button', 'btn btn-dark close', 'Close'); c.type = 'button'; c.onclick = () => { DRILL = null; d.textContent = ''; document.querySelectorAll('.kpi').forEach(k => k.setAttribute('aria-pressed', 'false')); };
    h.appendChild(c); wrap.appendChild(h);
    const { cols, rows } = t.rows();
    if (!rows.length) { wrap.appendChild(el('div', 'empty', 'Nothing here yet.')); d.appendChild(wrap); return; }
    const table = el('table'); const th = el('thead'); const tr = el('tr'); cols.forEach(x => tr.appendChild(el('th', null, x))); th.appendChild(tr); table.appendChild(th);
    const tb = el('tbody'); rows.forEach(r => { const row = el('tr'); r.forEach(v => row.appendChild(el('td', null, v == null ? '' : String(v)))); tb.appendChild(row); }); table.appendChild(tb);
    wrap.appendChild(table); d.appendChild(wrap); wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };
  function gameRows(list){ return { cols: ['Game', 'Status', 'League', 'Coach', 'Needs', 'Offer', 'Hourly', 'Requested', 'Helper'], rows: list.map(g => [g.whenText, g.status, g.league || '', g.coach || g.coachEmail, g.needs, '$' + g.offer, Number(g.length) ? money(Number(g.offer) / Number(g.length)) : '', fmtDate(g.requested), g.helperName || '']) }; }
  function helperRows(list){ return { cols: ['Name', 'Joined', 'Status', 'Leagues', 'Does', 'Skill', 'Rating', 'Games'], rows: list.map(h => [h.name + (h.founder ? ' #' + h.founder : ''), fmtDate(h.submitted), eligible(h).ok ? 'Ready' : eligible(h).why, h.leagues, h.roles, h.skill, h.avg ? h.avg + ' (' + h.count + ')' : '', h.gdh + ' / ' + h.prior]) }; }
  function coachRows(list){ return { cols: ['Name', 'Joined', 'Team', 'Leagues', 'Email', 'Phone', 'Requests'], rows: list.map(c => [c.name + (c.founder ? ' #' + c.founder : ''), fmtDate(c.submitted), c.team, c.leagues, c.email, c.phone, DATA.games.filter(g => g.coachEmail === c.email).length]) }; }
  function leagueRows(list){ return { cols: ['Date', 'Name', 'Org', 'Email', 'Contacted'], rows: list.map(l => [fmtDate(l.submitted), l.name, l.org, l.email, l.contacted]) }; }
  function reviewRows(list){ return { cols: ['Date', 'Game', 'About', 'Role', 'Stars', 'Comment'], rows: list.map(r => [fmtDate(r.submitted), r.gameId, r.revieweeId, r.revieweeRole, '\u2605'.repeat(r.stars), r.comment]) }; }

  /* ---------- trends: one series per chart, weekly counts, last 8 weeks ---------- */
  function weekly(items, key){
    const now = weekKey(new Date().toISOString()); const weeks = [];
    for (let i = 7; i >= 0; i--) { const d = new Date(now); d.setDate(d.getDate() - i * 7); weeks.push({ start: d, n: 0 }); }
    items.forEach(it => { const k = weekKey(it[key]); if (!k) return; const w = weeks.find(w => w.start.getTime() === k.getTime()); if (w) w.n++; });
    return weeks;
  }
  function chart(title, sub, weeks){
    const box = el('div', 'trend'); box.appendChild(el('div', 't', title)); box.appendChild(el('div', 's', sub));
    const W = 320, H = 96, pad = 4, gap = 2, bw = (W - pad * 2) / weeks.length - gap, max = Math.max(1, ...weeks.map(w => w.n));
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', title + ': ' + weeks.map(w => fmtDate(w.start) + ' ' + w.n).join(', '));
    weeks.forEach((w, i) => {
      const h = Math.round((H - 28) * w.n / max), x = pad + i * (bw + gap), y = H - 16 - h;
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect'); r.setAttribute('x', x); r.setAttribute('y', y); r.setAttribute('width', bw); r.setAttribute('height', Math.max(h, w.n ? 4 : 1)); r.setAttribute('rx', 3);
      if (!w.n) r.setAttribute('opacity', '.25');
      const tt = document.createElementNS('http://www.w3.org/2000/svg', 'title'); tt.textContent = 'Week of ' + fmtDate(w.start) + ': ' + w.n; r.appendChild(tt); svg.appendChild(r);
      if (i === weeks.length - 1 || w.n === max) { const t = document.createElementNS('http://www.w3.org/2000/svg', 'text'); t.setAttribute('x', x + bw / 2); t.setAttribute('y', y - 3); t.setAttribute('text-anchor', 'middle'); t.setAttribute('class', 'v'); t.textContent = w.n; svg.appendChild(t); }
      if (i === 0 || i === weeks.length - 1) { const t = document.createElementNS('http://www.w3.org/2000/svg', 'text'); t.setAttribute('x', x + bw / 2); t.setAttribute('y', H - 3); t.setAttribute('text-anchor', 'middle'); t.textContent = fmtDate(w.start); svg.appendChild(t); }
    });
    box.appendChild(svg); return box;
  }
  function renderTrends(){
    const t = $('trends'); t.textContent = '';
    const h = weekly(DATA.helpers, 'submitted'), c = weekly(DATA.coaches, 'submitted'), g = weekly(DATA.games, 'requested');
    const sum = w => w.reduce((a, x) => a + x.n, 0);
    t.appendChild(chart('Helper signups', sum(h) + ' in 8 weeks', h));
    t.appendChild(chart('Coach signups', sum(c) + ' in 8 weeks', c));
    t.appendChild(chart('Game requests', sum(g) + ' in 8 weeks', g));
  }

  async function doMatch(g, h, btn){
    if (!confirm('Send match emails: ' + h.name + ' to ' + (g.coach || g.coachEmail) + ' for ' + g.whenText + '?')) return;
    btn.disabled = true; btn.textContent = 'Sending...';
    try { const r = await post({ type: 'MATCH', gameId: g.id, helperId: h.id }); setStatus(r.message, r.result !== 'success'); if (r.result === 'success') await load(); else { btn.disabled = false; btn.textContent = 'Send match'; } }
    catch (e) { setStatus('Request failed. Check the Executions log.', true); btn.disabled = false; btn.textContent = 'Send match'; }
  }
  async function doApprove(h, btn, unapprove){
    btn.disabled = true;
    try { const r = await post({ type: 'APPROVE', helperId: h.id, approved: !unapprove }); setStatus(r.message, r.result !== 'success'); await load(); }
    catch (e) { setStatus('Request failed.', true); btn.disabled = false; }
  }
  async function doUnfill(g, btn){
    if (!confirm('Mark ' + g.id + ' unfilled and email the coach?')) return;
    btn.disabled = true;
    try { const r = await post({ type: 'UNFILL', gameId: g.id }); setStatus(r.message, r.result !== 'success'); await load(); }
    catch (e) { setStatus('Request failed.', true); btn.disabled = false; }
  }

  $('load').addEventListener('click', load);
  $('refresh').addEventListener('click', load);
  keyBox.addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
  if (keyBox.value) load();
</script>
